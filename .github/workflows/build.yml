#
# Checks on every push and pull request: links and anchors, README up to date, example files verify.
# (This workflow has not been run on GitHub yet.)
name: Build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tests/check_repo.py
      - run: python -m compileall -q code tools tests
